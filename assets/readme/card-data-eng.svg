    <path d="M 0 24 L 38 4 L 0 -16 L -38 4 Z" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M 0 30 L 38 10 L 38 4 L 0 24 Z" fill="#0B132B"/>
    <path d="M 0 30 L -38 10 L -38 4 L 0 24 Z" fill="#080D1E"/>

    <!-- Layer 2 (Middle) -->
    <path d="M 0 10 L 38 -10 L 0 -30 L -38 -10 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M 0 16 L 38 -4 L 38 -10 L 0 10 Z" fill="#0369A1"/>
    <path d="M 0 16 L -38 -4 L -38 -10 L 0 10 Z" fill="#075985"/>

    <!-- Layer 1 (Top) -->
    <path d="M 0 -4 L 38 -24 L 0 -44 L -38 -24 Z" fill="#38BDF8" stroke="#7DD3FC" stroke-width="1.2"/>
