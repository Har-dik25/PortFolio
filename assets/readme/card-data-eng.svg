<svg width="430" height="150" viewBox="0 0 430 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="429" height="149" rx="14" fill="#090E1A" stroke="#1E293B"/>
  <path d="M 16 0.5 L 200 0.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 3D Stacked Layers Icon -->
  <g transform="translate(58, 76)">
