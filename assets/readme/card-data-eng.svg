    <text x="125" y="70" fill="#94A3B8" font-size="12.5" font-weight="400">Ingestion and cleaning pipelines,</text>
    <text x="125" y="90" fill="#94A3B8" font-size="12.5" font-weight="400">SQLite and Parquet stores, make-</text>
    <text x="125" y="110" fill="#94A3B8" font-size="12.5" font-weight="400">driven rebuilds and pytest-backed</text>
    <text x="125" y="130" fill="#94A3B8" font-size="12.5" font-weight="400">validation.</text>
