<svg width="430" height="150" viewBox="0 0 430 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="429" height="149" rx="14" fill="#090E1A" stroke="#1E293B"/>
  <path d="M 16 0.5 L 200 0.5" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 3D Bar Chart Icon -->
  <g transform="translate(60, 85)">
    <!-- Base Platform -->
    <path d="M 0 20 L 36 0 L 0 -20 L -36 0 Z" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
    
    <!-- Bar 1 (Purple) -->
    <path d="M -20 -4 L -8 -11 L -8 -38 L -20 -31 Z" fill="#7E22CE"/>
    <path d="M -8 -11 L 4 -4 L 4 -31 L -8 -38 Z" fill="#A855F7"/>
    <path d="M -20 -31 L -8 -38 L 4 -31 L -8 -24 Z" fill="#C084FC"/>

    <!-- Bar 2 (Amber) -->
    <path d="M 0 8 L 12 1 L 12 -42 L 0 -35 Z" fill="#B45309"/>
    <path d="M 12 1 L 24 8 L 24 -35 L 12 -42 Z" fill="#F59E0B"/>
    <path d="M 0 -35 L 12 -42 L 24 -35 L 12 -28 Z" fill="#FCD34D"/>
  </g>

  <!-- Content -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="125" y="44" fill="#FFFFFF" font-size="18" font-weight="700">Data science</text>
    <text x="125" y="70" fill="#94A3B8" font-size="12.5" font-weight="400">Analytics, composite indices, lead-</text>
    <text x="125" y="90" fill="#94A3B8" font-size="12.5" font-weight="400">lag correlation, SHAP-explained</text>
    <text x="125" y="110" fill="#94A3B8" font-size="12.5" font-weight="400">models, geospatial analysis and</text>
    <text x="125" y="130" fill="#94A3B8" font-size="12.5" font-weight="400">what-if simulation.</text>
  </g>
</svg>