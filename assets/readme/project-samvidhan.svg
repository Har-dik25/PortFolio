<svg width="860" height="240" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="859" height="239" rx="16" fill="#080D1A" stroke="#1E293B"/>

  <!-- Left: Legal Document Pipeline into Portal Server -->
  <g transform="translate(130, 120)">
    <!-- Document Stack -->
    <g transform="translate(-70, 0)">
      <!-- Sheet 3 -->
      <path d="M -40 25 L 10 5 L -10 -25 L -60 -5 Z" fill="#1E293B"/>
      <!-- Sheet 2 -->
      <path d="M -40 18 L 10 -2 L -10 -32 L -60 -12 Z" fill="#334155"/>
      <!-- Sheet 1 (Top) -->
      <path d="M -40 10 L 10 -10 L -10 -40 L -60 -20 Z" fill="#67E8F9" stroke="#E0F2FE" stroke-width="1"/>
      <line x1="-35" y1="5" x2="-5" y2="-12" stroke="#0284C7" stroke-width="1.5"/>
      <line x1="-32" y1="-2" x2="-2" y2="-19" stroke="#0284C7" stroke-width="1.5"/>
      <line x1="-29" y1="-9" x2="1" y2="-26" stroke="#0284C7" stroke-width="1.5"/>
    </g>

    <!-- Circular Beam & Rings -->
    <ellipse cx="60" cy="0" rx="35" ry="35" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 6"/>
    <ellipse cx="60" cy="0" rx="20" ry="20" fill="#0284C7" opacity="0.4"/>
    <circle cx="60" cy="0" r="8" fill="#38BDF8"/>

    <!-- Server / Legal Portal Gateway -->
    <g transform="translate(150, 0)">
      <path d="M 0 45 L 30 30 L 30 -40 L 0 -25 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <path d="M -15 35 L 0 45 L 0 -25 L -15 -35 Z" fill="#0F172A"/>
      <line x1="5" y1="20" x2="25" y2="10" stroke="#38BDF8" stroke-width="1"/>
      <line x1="5" y1="0" x2="25" y2="-10" stroke="#38BDF8" stroke-width="1"/>
      <line x1="5" y1="-20" x2="25" y2="-30" stroke="#38BDF8" stroke-width="1"/>
    </g>

    <!-- Streaming Packets -->
    <circle cx="0" cy="-2" r="3" fill="#FCD34D"/>
    <circle cx="20" cy="-1" r="3" fill="#FCD34D"/>
    <circle cx="105" cy="0" r="3" fill="#38BDF8"/>
  </g>

  <!-- Right: 2-column Tech Badges -->
  <g transform="translate(520, 28)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Python -->
    <rect x="0" y="0" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="22" cy="18" r="8" fill="#3B82F6"/>
    <text x="38" y="23" fill="#E2E8F0">Python</text>

    <!-- FastAPI -->
    <rect x="160" y="0" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="182" cy="18" r="8" fill="#059669"/>
    <text x="198" y="23" fill="#E2E8F0">FastAPI</text>

    <!-- React -->
    <rect x="0" y="48" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="22" cy="66" r="8" fill="#06B6D4"/>
    <text x="38" y="71" fill="#E2E8F0">React</text>

    <!-- Vite -->
    <rect x="160" y="48" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="182" cy="66" r="8" fill="#A855F7"/>
    <text x="198" y="71" fill="#E2E8F0">Vite</text>

    <!-- ChromaDB -->
    <rect x="0" y="96" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="22" cy="114" r="8" fill="#EC4899"/>
    <text x="38" y="119" fill="#E2E8F0">ChromaDB</text>

    <!-- BM25 -->
    <rect x="160" y="96" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="182" cy="114" r="8" fill="#6366F1"/>
    <text x="198" y="119" fill="#E2E8F0">BM25</text>

    <!-- SQLite -->
    <rect x="0" y="144" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="22" cy="162" r="8" fill="#0284C7"/>
    <text x="38" y="167" fill="#E2E8F0">SQLite</text>

    <!-- DVC -->
    <rect x="160" y="144" width="145" height="36" rx="10" fill="#0D1627" stroke="#1E293B"/>
    <circle cx="182" cy="162" r="8" fill="#9333EA"/>
    <text x="198" y="167" fill="#E2E8F0">DVC</text>
  </g>
</svg>