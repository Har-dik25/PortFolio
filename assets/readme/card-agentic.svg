<svg width="430" height="150" viewBox="0 0 430 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="429" height="149" rx="14" fill="#090E1A" stroke="#1E293B"/>
  <path d="M 16 0.5 L 200 0.5" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 3D Gateway / Portal Icon -->
  <g transform="translate(60, 85)">
    <!-- Base Platform -->
    <path d="M 0 22 L 36 2 L 0 -18 L -36 2 Z" fill="#1C1917" stroke="#44403C" stroke-width="1"/>
    
    <!-- Arch / Portal -->
    <!-- Left Pillar -->
    <path d="M -16 12 L -8 8 L -8 -30 L -16 -26 Z" fill="#EA580C"/>
    <path d="M -8 8 L -2 12 L -2 -26 L -8 -30 Z" fill="#F97316"/>
    <!-- Right Pillar -->
    <path d="M 8 0 L 16 -4 L 16 -42 L 8 -38 Z" fill="#EA580C"/>
    <path d="M 16 -4 L 22 0 L 22 -38 L 16 -42 Z" fill="#F97316"/>
    <!-- Lintel Top -->
    <path d="M -16 -26 L 16 -42 L 22 -38 L -10 -22 Z" fill="#FDBA74"/>

    <!-- Glowing Portal Center Orb -->
    <circle cx="2" cy="-8" r="4.5" fill="#38BDF8"/>
  </g>

  <!-- Content -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="125" y="44" fill="#FFFFFF" font-size="18" font-weight="700">Agentic systems</text>
    <text x="125" y="70" fill="#94A3B8" font-size="12.5" font-weight="400">Policy-gated tool chains with</text>
    <text x="125" y="90" fill="#94A3B8" font-size="12.5" font-weight="400">retries, human escalation and audit</text>
    <text x="125" y="110" fill="#94A3B8" font-size="12.5" font-weight="400">logs, behind FastAPI back ends and</text>
    <text x="125" y="130" fill="#94A3B8" font-size="12.5" font-weight="400">React, Next.js or Streamlit front ends.</text>
  </g>
</svg>